<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft</title>
    <style>
        table {
            width: 60%;
            border-collapse: collapse;
            margin: auto;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        button {
            margin-top: 10px;
        }

        tr:hover {
            background-color: aqua;
            cursor: pointer;
        }

        tr.selected {
            background-color: #b3e5fc !important;
            ;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
    <h3>Draft Add Items Version</h3>
    <div>
        <select name="items" id="item" multiple>
            <option value="100">Apple</option>
            <option value="200">Banana</option>
            <option value="300">Orange</option>
            <option value="400">Mango</option>
            <option value="500">Pineapple</option>
        </select>
        <br><br>
        <button class="add">Add</button>
    </div>
    <table class="bill">
        <thead>
            <tr>
                <th>Item</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <!-- Các item sẽ được thêm vào đây-->
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3"> Total</td>
                <td id="total">0</td>
            </tr>
        </tfoot>
    </table>
    <script>
        // khi trang được load xong thì thực hiện bên dưới
        $(document).ready(function () {
            // Khi nhấn nút add
            $('.add').on('click', function () {
                $('#item option:selected').each(function () {
                    const itemName = $(this).text();
                    const unitPrice = parseInt($(this).val());

                    // Kiểm tra xem sản phẩm đã có trong bảng chưa
                    const existingRow = $('.bill tbody tr').filter(function () {
                        return $(this).find('td:first').text() === itemName;
                    });

                    if (existingRow.length > 0) {
                        // Nếu đã có sản phẩm -> tăng số lượng, cập nhật giá
                        const qtyInput = existingRow.find('.qty');
                        let currentQty = parseInt(qtyInput.val());
                        currentQty++;
                        qtyInput.val(currentQty);

                        const basePrice = parseInt(existingRow.data('price'));
                        existingRow.find('.price').text(currentQty * basePrice);
                    } else {
                        // Nếu chưa có -> thêm hàng mới
                        const newRow = $(`
                        <tr data-price="${unitPrice}">
                            <td>${itemName}</td>
                            <td><input type="number" class="qty" value="1"  min ="1"></td>
                            <td class="price">${unitPrice}</td>
                            <td><button class="delete-btn">Delete</button></td>
                        </tr> 
                `);
                        $('.bill tbody').append(newRow);
                    }
                });
                updateTotal();
            });

            // Khi thay đổi số lượng -> cập nhật lại giá và tổng
            $(document).on('input', '.qty', function () {
                const row = $(this).closest('tr');
                const qty = parseInt($(this).val());
                const basePrice = parseInt(row.data('price'));
                row.find('.price').text(qty * basePrice);
                updateTotal();
            });

            // Khi nhấn nút delete -> xóa hàng, cập nhật lại tổng giá
            $(document).on('click', '.delete-btn', function () {
                $(this).closest('tr').remove();
                updateTotal();
            });

            // Hàm tính tổng
            function updateTotal() {
                let total = 0;
                // cộng từng dòng item 
                $('.bill tbody tr').each(function () {
                    total += parseInt($(this).find('.price').text());
                });
                $('#total').text(total);
            }
        });
    </script>
</body>

</html>
